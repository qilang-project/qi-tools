[package]
name = "qi-tools"
version = "2026.7.29-1"
edition = "2021"

[[bin]]
name = "qifmt"
path = "src/bin/qifmt.rs"

[[bin]]
name = "qicheck"
path = "src/bin/qicheck.rs"

[[bin]]
name = "qidoc"
path = "src/bin/qidoc.rs"

[[bin]]
name = "qi-bindgen"
path = "src/bin/qibindgen.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.3"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
# path 依赖不发布到 crates.io，不要钉版本 —— 钉了的话 qi 每次发版
# 都得同步改这里，忘一次整个 workspace 就编不过（2026-07-29 踩过）。
qi-compiler = { path = "../qi" }
# libclang 动态加载：解析 C 头文件生成 外部 声明（qi-bindgen）
clang-sys = { version = "1.8", features = ["runtime"] }

[lib]
name = "qi_tools"
path = "src/lib.rs"

[[bin]]
name = "qiprof"
path = "src/bin/qiprof.rs"
